<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Visuel de chapitre II — PLACEHOLDER de démonstration du multi-niveaux.
       À remplacer par l'illustration définitive des Clefs de la ville. -->
  <defs>
    <linearGradient id="c2bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2a5e"/>
      <stop offset="100%" stop-color="#1d1233"/>
    </linearGradient>
    <linearGradient id="c2metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6d98a"/>
      <stop offset="55%" stop-color="#c99a42"/>
      <stop offset="100%" stop-color="#8a6520"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#c2bg)"/>
  <circle cx="200" cy="186" r="118" fill="none" stroke="#a78bfa" stroke-opacity="0.28" stroke-width="1.5"/>
  <circle cx="200" cy="186" r="150" fill="none" stroke="#a78bfa" stroke-opacity="0.14" stroke-width="1"/>
  <!-- Deux clefs : la seconde se devine, encore incomplète -->
  <g transform="translate(150 120) rotate(-14)">
    <circle cx="34" cy="34" r="26" fill="none" stroke="url(#c2metal)" stroke-width="11"/>
    <rect x="28" y="56" width="12" height="118" fill="url(#c2metal)"/>
    <rect x="40" y="136" width="26" height="11" fill="url(#c2metal)"/>
    <rect x="40" y="158" width="18" height="11" fill="url(#c2metal)"/>
  </g>
  <g transform="translate(214 140) rotate(12)" opacity="0.45">
    <circle cx="30" cy="30" r="22" fill="none" stroke="url(#c2metal)" stroke-width="9"/>
    <rect x="25" y="48" width="10" height="100" fill="url(#c2metal)"/>
    <rect x="35" y="118" width="22" height="9" fill="url(#c2metal)"/>
  </g>
  <text x="200" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="21"
        fill="#f4ecdb" fill-opacity="0.82" letter-spacing="3">CHAPITRE II</text>
  <text x="200" y="378" text-anchor="middle" font-family="Georgia, serif" font-size="12"
        font-style="italic" fill="#c4b5fd" fill-opacity="0.65">visuel provisoire</text>
</svg>
