<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Visuel de chapitre III — PLACEHOLDER de démonstration du multi-niveaux.
       À remplacer par l'illustration définitive des Clefs de la ville. -->
  <defs>
    <radialGradient id="c3bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#5b3f14"/>
      <stop offset="55%" stop-color="#2a1c33"/>
      <stop offset="100%" stop-color="#150d22"/>
    </radialGradient>
    <linearGradient id="c3metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#e8bf62"/>
      <stop offset="100%" stop-color="#a2761f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#c3bg)"/>
  <circle cx="200" cy="180" r="126" fill="none" stroke="#fbbf24" stroke-opacity="0.32" stroke-width="1.5"/>
  <circle cx="200" cy="180" r="158" fill="none" stroke="#fbbf24" stroke-opacity="0.16" stroke-width="1"/>
  <!-- Le plat, et les trois clefs réunies -->
  <ellipse cx="200" cy="286" rx="132" ry="26" fill="none" stroke="#d8d2c4" stroke-opacity="0.5" stroke-width="3"/>
  <ellipse cx="200" cy="286" rx="112" ry="19" fill="none" stroke="#d8d2c4" stroke-opacity="0.28" stroke-width="1.5"/>
  <g transform="translate(112 108) rotate(-20)">
    <circle cx="28" cy="28" r="21" fill="none" stroke="url(#c3metal)" stroke-width="9"/>
    <rect x="23" y="46" width="10" height="104" fill="url(#c3metal)"/>
    <rect x="33" y="118" width="22" height="9" fill="url(#c3metal)"/>
  </g>
  <g transform="translate(178 92)">
    <circle cx="30" cy="30" r="24" fill="none" stroke="url(#c3metal)" stroke-width="10"/>
    <rect x="24" y="50" width="12" height="120" fill="url(#c3metal)"/>
    <rect x="36" y="128" width="26" height="10" fill="url(#c3metal)"/>
    <rect x="36" y="150" width="18" height="10" fill="url(#c3metal)"/>
  </g>
  <g transform="translate(248 108) rotate(20)">
    <circle cx="28" cy="28" r="21" fill="none" stroke="url(#c3metal)" stroke-width="9"/>
    <rect x="23" y="46" width="10" height="104" fill="url(#c3metal)"/>
    <rect x="33" y="118" width="22" height="9" fill="url(#c3metal)"/>
  </g>
  <text x="200" y="352" text-anchor="middle" font-family="Georgia, serif" font-size="21"
        fill="#f8f0dc" fill-opacity="0.88" letter-spacing="3">CHAPITRE III</text>
  <text x="200" y="378" text-anchor="middle" font-family="Georgia, serif" font-size="12"
        font-style="italic" fill="#fcd34d" fill-opacity="0.6">visuel provisoire</text>
</svg>
